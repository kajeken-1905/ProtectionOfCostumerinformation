<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대리점 고객정보보호 점검</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F5F6F3;
    --surface:#FFFFFF;
    --surface-2:#EEF0EC;
    --border:#DCDFD8;
    --text:#1B1F1C;
    --text-muted:#666B64;
    --accent:#1F3A54;
    --accent-strong:#16293C;
    --accent-contrast:#FFFFFF;
    --critical:#9A2C22;
    --critical-surface:#FBEEEC;
    --success:#2E6B4B;
    --success-surface:#EAF3ED;
    --radius:12px;
    --font-ui:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171A;
      --surface:#1C2024;
      --surface-2:#20252A;
      --border:#2E343A;
      --text:#E9EBE8;
      --text-muted:#9AA09A;
      --accent:#6C97BE;
      --accent-strong:#8AB0D4;
      --accent-contrast:#0F1418;
      --critical:#E2867B;
      --critical-surface:#3A211D;
      --success:#7FC49C;
      --success-surface:#1E3327;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171A;
    --surface:#1C2024;
    --surface-2:#20252A;
    --border:#2E343A;
    --text:#E9EBE8;
    --text-muted:#9AA09A;
    --accent:#6C97BE;
    --accent-strong:#8AB0D4;
    --accent-contrast:#0F1418;
    --critical:#E2867B;
    --critical-surface:#3A211D;
    --success:#7FC49C;
    --success-surface:#1E3327;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:0 0 96px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:14px 18px 10px;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px; margin-bottom:12px;
  }
  .brand .mark{
    font-family:var(--font-mono); font-weight:600; font-size:11px;
    letter-spacing:.08em; color:var(--accent); border:1px solid var(--accent);
    padding:2px 6px; border-radius:5px;
  }
  .brand h1{ font-size:15px; font-weight:700; margin:0; }
  .steps{ display:flex; gap:6px; }
  .steps .dot{
    flex:1; height:4px; border-radius:2px; background:var(--border);
    transition:background .25s;
  }
  .steps .dot.active{ background:var(--accent); }
  .steps .dot.done{ background:var(--success); }
  main{ flex:1; padding:20px 18px 8px; }
  .step-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
    color:var(--text-muted); text-transform:uppercase; margin:0 0 6px;
  }
  h2.step-title{ font-size:20px; margin:0 0 4px; font-weight:700; }
  p.step-desc{ color:var(--text-muted); font-size:13.5px; margin:0 0 20px; line-height:1.5; }
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
  }
  label.field-label{
    display:block; font-size:12.5px; font-weight:500; color:var(--text-muted);
    margin-bottom:6px;
  }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  input[type=text], input[type=date], select, textarea{
    width:100%; font-family:var(--font-ui); font-size:15px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:11px 12px; outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:70px; font-size:13px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .store-select-row{ display:flex; gap:8px; }
  .store-select-row select{ flex:1; }
  .btn{
    font-family:var(--font-ui); font-weight:700; font-size:14.5px;
    border-radius:9px; border:1px solid transparent; padding:12px 16px;
    cursor:pointer; text-align:center;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--accent); border-color:var(--accent); }
  .btn-critical{ background:var(--critical); color:#fff; }
  .btn-sm{ font-size:12.5px; padding:8px 12px; border-radius:7px; }
  .btn-block{ width:100%; }
  .group{ margin-bottom:18px; }
  .group-title{
    font-family:var(--font-mono); font-size:11.5px; font-weight:600; letter-spacing:.04em;
    color:var(--accent); text-transform:uppercase; margin:0 0 8px; display:flex; align-items:center; gap:6px;
  }
  .group-title .n{
    background:var(--accent); color:var(--accent-contrast); width:16px; height:16px; border-radius:4px;
    display:inline-flex; align-items:center; justify-content:center; font-size:10px;
  }
  .check-item{
    display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border);
  }
  .check-item:last-child{ border-bottom:none; }
  .check-item .box{
    flex:none; width:26px; height:26px; border-radius:7px; border:1.6px solid var(--border);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:900; color:transparent; transition:all .15s; margin-top:1px;
  }
  .check-item.on .box{ background:var(--success); border-color:var(--success); color:#fff; }
  .check-item .box{ cursor:pointer; }
  .check-item .txt{
    font-size:13.6px; line-height:1.45; cursor:pointer; flex:1;
    text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; text-decoration-color:var(--text-muted);
  }
  .check-item .txt b{ font-weight:600; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,12,10,.55); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--surface); width:100%; max-width:520px; border-radius:16px 16px 0 0;
    max-height:78vh; overflow-y:auto; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    animation:modal-up .18s ease-out;
  }
  @keyframes modal-up{ from{ transform:translateY(16px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal-sheet h3{ font-size:16px; margin:0 0 12px; font-weight:700; padding-right:30px; }
  .modal-sheet pre{
    font-family:var(--font-ui); font-size:13.5px; line-height:1.65; white-space:pre-wrap;
    margin:0 0 16px; color:var(--text);
  }
  .modal-close{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:8px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-size:16px; line-height:1; cursor:pointer;
  }
  .modal-sheet{ position:relative; }
  .voc-list{ list-style:none; margin:0 0 18px; padding:0; counter-reset:voc; }
  .voc-list li{
    counter-increment:voc; position:relative; padding:8px 0 8px 30px; font-size:13px;
    line-height:1.5; border-bottom:1px dashed var(--border); color:var(--text);
  }
  .voc-list li:before{
    content:counter(voc); position:absolute; left:0; top:8px; width:20px; height:20px;
    background:var(--critical-surface); color:var(--critical); font-weight:700; font-size:11px;
    border-radius:5px; display:flex; align-items:center; justify-content:center;
  }
  canvas.sigpad{
    width:100%; height:150px; background:var(--surface-2); border:1.5px dashed var(--border);
    border-radius:9px; touch-action:none; display:block;
  }
  .sig-actions{ display:flex; justify-content:flex-end; margin-top:8px; }
  .preview-card{ text-align:center; }
  .preview-card img{ width:100%; border-radius:8px; border:1px solid var(--border); display:block; }
  .preview-card .cap{ font-size:12px; color:var(--text-muted); margin-top:8px; }
  .hint{
    font-size:12px; color:var(--text-muted); background:var(--surface-2);
    border-radius:8px; padding:10px 12px; line-height:1.55; margin-top:12px;
  }
  .status-msg{ font-size:12.5px; border-radius:8px; padding:10px 12px; margin-top:10px; display:none; }
  .status-msg.show{ display:block; }
  .status-msg.ok{ background:var(--success-surface); color:var(--success); }
  .status-msg.err{ background:var(--critical-surface); color:var(--critical); }
  footer.navbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--border);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  }
  footer.navbar .wrap{ max-width:520px; margin:0 auto; display:flex; gap:10px; }
  footer.navbar .wrap .btn{ flex:1; }
  .required-star{ color:var(--critical); }
  .done-badge{
    display:inline-flex; align-items:center; gap:6px; background:var(--success-surface); color:var(--success);
    font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:7px; margin-bottom:12px;
  }
  .field-name-inline{ display:flex; gap:10px; }
  .field-name-inline .field{ flex:1; }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark">SKT</span>
      <h1>대리점 고객정보보호 점검</h1>
    </div>
    <div class="steps">
      <div class="dot" data-step="0"></div>
      <div class="dot" data-step="1"></div>
      <div class="dot" data-step="2"></div>
      <div class="dot" data-step="3"></div>
      <div class="dot" data-step="4"></div>
    </div>
  </header>
  <main id="main"></main>
  <footer class="navbar">
    <div class="wrap" id="navwrap"></div>
  </footer>
</div>

  function createSignaturePad(){
    var canvas = null, ctx = null, hasStroke = false, points = [];
    function pos(e){
      var r = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      return {x:cx, y:cy};
    }
    function redraw(cssW, cssH){
      ctx.clearRect(0,0,cssW,cssH);
      points.forEach(function(stroke){
        if(stroke.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for(var i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x, stroke[i].y);
        ctx.stroke();
      });
    }
    function attach(el){
      canvas = el;
      var ratio = window.devicePixelRatio || 1;
      var cssW = canvas.clientWidth || 300;
      var cssH = 150;
      canvas.width = cssW * ratio;
      canvas.height = cssH * ratio;
      ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 3.6;
      ctx.strokeStyle = "#000";
      if(hasStroke && points.length) redraw(cssW, cssH);

      var drawing = false, last = null;
      function start(e){ e.preventDefault(); drawing = true; last = pos(e); points.push([last]); }
      function move(e){
        if(!drawing) return;
        e.preventDefault();
        var p = pos(e);
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
        points[points.length-1].push(p);
        hasStroke = true;
      }
      function end(){ if(drawing){ drawing = false; last = null; renderNav(); } }
      canvas.addEventListener("pointerdown", start);
      canvas.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      canvas.addEventListener("touchstart", start, {passive:false});
      canvas.addEventListener("touchmove", move, {passive:false});
      canvas.addEventListener("touchend", end);
    }
    function clear(){
      points = []; hasStroke = false;
      if(ctx && canvas) ctx.clearRect(0,0,canvas.clientWidth,150);
    }
    return {
      attach: attach,
      clear: clear,
      hasStroke: function(){ return hasStroke; },
      getCanvas: function(){ return canvas; }
    };

  function loadImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  // Print-quality multiplier: the source scans are 562x795px (~68dpi at A4).
  // Drawing through a scaled context keeps every coordinate below in that
  // original 562x795 space while the actual canvas/output pixels come out
  // RENDER_SCALE times larger, so overlaid text/checkmarks/signatures stay
  // sharp when the PDF is printed at A4.
  var RENDER_SCALE = 3;

  function composeChecklistDoc(){
    return loadImage(IMG_CHECKLIST_SRC).then(function(img){
      var canvas = drawChecklist(img);
      return { canvas: canvas, url: canvas.toDataURL("image/png") };
    });
  }
  function composeVocDoc(){
    return loadImage(IMG_VOC_SRC).then(function(img){
      var canvas = drawVoc(img);
      return { canvas: canvas, url: canvas.toDataURL("image/png") };
    });
  }
  function composeDocuments(){
    return Promise.all([composeChecklistDoc(), composeVocDoc()]).then(function(r){
      return {
        checklistCanvas: r[0].canvas,
        vocCanvas: r[1].canvas,
        checklistUrl: r[0].url,
        vocUrl: r[1].url
      };
    });
  }

  function drawChecklist(img){
    var c = document.createElement("canvas");
    c.width = 562 * RENDER_SCALE; c.height = 795 * RENDER_SCALE;
    var ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.scale(RENDER_SCALE, RENDER_SCALE);
    ctx.drawImage(img, 0, 0, 562, 795);
    ctx.fillStyle = "#000";
    ctx.textBaseline = "alphabetic";

    ctx.font = "13px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
    ctx.textAlign = "left";
    fitText(ctx, state.storeBranch, 100, 81, 150);
    fitText(ctx, state.storeCode, 307, 81, 110);
    fitText(ctx, formatDateDot(state.inspectDate), 100, 106, 95);
    fitText(ctx, state.inspector, 420, 106, 85);

    // inspector's confirmation signature over the "(확인)" mark next to 점검자
    if(inspectorSig.getCanvas()){
      ctx.drawImage(inspectorSig.getCanvas(), 506, 90, 52, 24);
    }

    ctx.textAlign = "center";
    ctx.font = "bold 15px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
    ALL_ITEMS.forEach(function(item, i){
      if(state.checks[i]){
        ctx.fillText("✓", 542, item.y + 5);
      }
    });
    return c;
  }

  function drawVoc(img){
    var c = document.createElement("canvas");
    c.width = 562 * RENDER_SCALE; c.height = 795 * RENDER_SCALE;
    var ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.scale(RENDER_SCALE, RENDER_SCALE);
    ctx.drawImage(img, 0, 0, 562, 795);
    ctx.fillStyle = "#000";
    ctx.textBaseline = "alphabetic";

    // cover the YYYY-MM-DD placeholder then write real date
    ctx.fillStyle = "#fff";
    ctx.fillRect(430, 28, 116, 34);
    ctx.fillStyle = "#000";
    ctx.font = "bold 13px 'IBM Plex Mono',monospace";
    ctx.textAlign = "center";
    ctx.fillText(state.vocDate, 488, 52);

    // "202_년 __월 __일" is set too tight (near-zero gap between characters) to slot digits into,
    // so cover the whole phrase and redraw the date fresh in the same spot.
    ctx.fillStyle = "#fff";
    ctx.fillRect(243, 699, 95, 21);
    ctx.fillStyle = "#000";
    var d = new Date(state.vocDate + "T00:00:00");
    ctx.font = "13px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(d.getFullYear() + "년 " + pad2(d.getMonth()+1) + "월 " + pad2(d.getDate()) + "일", 290, 715);

    // store name on the "___대리점" line (agency name, with trailing "대리점" trimmed since the template already prints that word)
    ctx.font = "12px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
    fitTextCentered(ctx, shortAgency(state.storeAgency), 212, 734, 68);

    // name written on the "___(서명)" line itself
    ctx.fillStyle = "#000";
    fitTextCentered(ctx, state.vocName, 323, 734, 66);

    // signature image just above that line, over the "(서명)" mark
    if(vocSig.getCanvas()){
      ctx.drawImage(vocSig.getCanvas(), 300, 710, 56, 24);
    }

    // small confirm checkbox top-right
    ctx.strokeStyle = "#000";
    ctx.fillStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(524, 84);
    ctx.lineTo(529, 90);
    ctx.lineTo(539, 76);
    ctx.stroke();

    return c;
  }

  function fitText(ctx, text, x, y, maxWidth){
    text = text || "";
    var w = ctx.measureText(text).width;
    if(w <= maxWidth){ ctx.fillText(text, x, y); return; }
    while(text.length > 1 && ctx.measureText(text + "…").width > maxWidth){
      text = text.slice(0, -1);
    }
    ctx.fillText(text + "…", x, y);
  }
  function fitTextCentered(ctx, text, cx, y, maxWidth){
    var prevAlign = ctx.textAlign;
    ctx.textAlign = "center";
    text = text || "";
    while(text.length > 1 && ctx.measureText(text).width > maxWidth){
      text = text.slice(0, -1);
    }
    ctx.fillText(text, cx, y);
    ctx.textAlign = prevAlign;
  }
  function shortAgency(name){
    return (name || "").replace(/대리점$/, "").trim();
  }
  function formatDateDot(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length !== 3) return iso;
    return p[0].slice(2) + "." + p[1] + "." + p[2];
  }

  // ---------- PDF assembly (no external deps) ----------
  function canvasToJpegBytes(canvas, quality){
    return new Promise(function(resolve){
      canvas.toBlob(function(blob){
        blob.arrayBuffer().then(function(buf){ resolve(new Uint8Array(buf)); });
      }, "image/jpeg", quality || 0.9);
    });
  }

  function buildPdf(pages){
    var chunks = [];
    var offset = 0;
    var offsets = [];
    var enc = new TextEncoder();
    function pushBytes(b){ chunks.push(b); offset += b.length; }
    function pushStr(s){ pushBytes(enc.encode(s)); }
    function beginObj(num){ offsets[num] = offset; pushStr(num + " 0 obj\n"); }
    function endObj(){ pushStr("endobj\n"); }

    var n = pages.length;
    var catalogNum = 1, pagesNum = 2;
    pushStr("%PDF-1.4\n");
    beginObj(catalogNum); pushStr("<< /Type /Catalog /Pages " + pagesNum + " 0 R >>\n"); endObj();
    beginObj(pagesNum);
    var kids = pages.map(function(_, i){ return (3 + i * 3) + " 0 R"; }).join(" ");
    pushStr("<< /Type /Pages /Kids [ " + kids + " ] /Count " + n + " >>\n"); endObj();

    pages.forEach(function(page, i){
      var pageObjNum = 3 + i * 3, contentObjNum = 4 + i * 3, imageObjNum = 5 + i * 3;
      var jpeg = page.jpeg, w = page.w, h = page.h, pxW = page.pxW, pxH = page.pxH;

      beginObj(pageObjNum);
      pushStr("<< /Type /Page /Parent " + pagesNum + " 0 R /MediaBox [0 0 " + w + " " + h + "] " +
        "/Resources << /XObject << /Im0 " + imageObjNum + " 0 R >> >> /Contents " + contentObjNum + " 0 R >>\n");
      endObj();

      var content = "q " + w + " 0 0 " + h + " 0 0 cm /Im0 Do Q";
      var cb = enc.encode(content);
      beginObj(contentObjNum);
      pushStr("<< /Length " + cb.length + " >>\nstream\n");
      pushBytes(cb);
      pushStr("\nendstream\n");
      endObj();

      beginObj(imageObjNum);
      pushStr("<< /Type /XObject /Subtype /Image /Width " + pxW + " /Height " + pxH +
        " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n");
      pushBytes(jpeg);
      pushStr("\nendstream\n");
      endObj();
    });

    var xrefOffset = offset;
    var totalObjs = 2 + n * 3;
    pushStr("xref\n0 " + (totalObjs + 1) + "\n0000000000 65535 f \n");
    for(var i = 1; i <= totalObjs; i++){
      pushStr(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
    }
    pushStr("trailer\n<< /Size " + (totalObjs + 1) + " /Root " + catalogNum + " 0 R >>\nstartxref\n" + xrefOffset + "\n%%EOF");

    var total = 0;
    chunks.forEach(function(c){ total += c.length; });
    var out = new Uint8Array(total);
    var p = 0;
    chunks.forEach(function(c){ out.set(c, p); p += c.length; });
    return out;
  }

  function savePdf(res){
    var baseName = state.inspectDate + "_" + (state.storeBranch || "매장") + "_고객정보보호점검";
    return Promise.all([
      canvasToJpegBytes(res.checklistCanvas, 0.9),
      canvasToJpegBytes(res.vocCanvas, 0.9)
    ]).then(function(jpegs){
      var pdfBytes = buildPdf([
        { jpeg: jpegs[0], w: 595, h: 842, pxW: res.checklistCanvas.width, pxH: res.checklistCanvas.height },
        { jpeg: jpegs[1], w: 595, h: 842, pxW: res.vocCanvas.width, pxH: res.vocCanvas.height }
      ]);
      return window.claude.use("downloads").then(function(downloads){
        if(!downloads){
          return Promise.reject({ code: "unavailable", message: "이 화면에서는 파일 저장 기능을 쓸 수 없습니다." });
        }
        return downloads.save({ filename: baseName + ".pdf", data: pdfBytes }).then(function(){
          return { mode: "pdf" };
        }).catch(function(err){
          var code = err && err.code;
          if(code === "extension_not_enabled" || code === "rejected_extension"){
            // PDF isn't allowed in this view; fall back to two PNG pages (base file-type set).
            return saveTwoPngs(downloads, baseName);
          }
          return Promise.reject(err);
        });
      });
    });

    function saveTwoPngs(downloads, baseName){
      return downloads.save({ filename: baseName + "_체크리스트.png", data: dataUrlToBytes(res.checklistUrl) })
        .then(function(){
          return downloads.save({ filename: baseName + "_서약서.png", data: dataUrlToBytes(res.vocUrl) });
        })
        .then(function(){ return { mode: "png" }; });
    }
  }

  function dataUrlToBytes(dataUrl){
    var b64 = dataUrl.split(",")[1];
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function resetForNextStore(){
    state.step = 0;
    state.storeAgency = "";
    state.storeBranch = "";
    state.storeCode = "";
    state.inspectDate = todayStr();
    state.checks = ALL_ITEMS.map(function(){ return false; });
    state.vocName = "";
    state.vocDate = todayStr();
    vocSig.clear();
    inspectorSig.clear();
  }

  render();
})();
</script>
